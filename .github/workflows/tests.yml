name: tests

# The suite was previously only runnable by hand, one file at a time, and the standard
# runner collected 5 of the 28 tests while still reporting OK. This job exists so that a
# green check means every test ran.
#
# The job itself is the organisation's reusable one: kineworld/.github supplies the
# checkout, the interpreter, the collection guard and the collection check. This file is
# only the three lines of adoption plus the two things that are genuinely local -- the CPU
# torch wheel, because CI has no GPU and the CUDA index pulls ~2.5 GB, and the concurrency
# group.
#
# It used to be a hand-written copy of that job, and the copy had already drifted: it ran
# the collection guard *before* the suite, so a collection failure was reported without the
# suite's own diagnostics beside it. That is the argument for the reusable form, made by
# this file against itself. Audit: kineworld/.github#3.
#
# Note what this job does not promise: that a local run agrees with it. The planner test
# passes here and fails on a local CUDA build of torch, because the assertion is about a
# ratio whose denominator is build-dependent. See kineworld/kine-jepa#3.

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    uses: kineworld/.github/.github/workflows/python-tests.yml@main
    with:
      install: "-r requirements.txt"
      post-install: "pip install torch --index-url https://download.pytorch.org/whl/cpu"
